name: sous

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sous
      POSTGRES_PASSWORD: sous
      POSTGRES_DB: sous
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sous -d sous"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SOUS_DATABASE_URL: postgresql+psycopg://sous:sous@db:5432/sous
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
